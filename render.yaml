services:
  - type: web
    name: himer-orchestrator
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        generateValue: true
      - key: PLATFORM_FEE
        value: 0.6
